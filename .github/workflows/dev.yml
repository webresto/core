name: Run tests
on:
  push:
    branches-ignore:
      - master
      - alpha
      - test-with-postgres
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Setup npmjs registry for dependencies
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install 2>&1 || true && npm run test:init 2>&1 || true && npm run test
      # models/*.js|d.ts are committed build artifacts of models/*.ts (build-models.sh): a .ts
      # edited without a rebuild is code that never runs. Fail the build on drift (review2 §3).
      - run: npm run check:models

